name: Publish GitHub release assets
on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Enforce owner-approved public release requirements
        run: node scripts/prepublish.mjs
      - name: Match tag and manifest version
        run: test "${GITHUB_REF_NAME}" = "$(node -p 'require("./manifest.json").version')"
      - name: Verify built JavaScript and version-specific notes
        run: |
          git diff --exit-code -- main.js
          test -s "docs/RELEASE_NOTES_${GITHUB_REF_NAME}.md"
      - name: Attest JavaScript build provenance
        uses: actions/attest@v4
        with:
          subject-path: main.js
      - name: Attest CSS build provenance
        uses: actions/attest@v4
        with:
          subject-path: styles.css
      - name: Create release with separate Obsidian assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error::Release $GITHUB_REF_NAME already exists; refusing to change published assets" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css \
            --verify-tag \
            --title "Mathsemble $GITHUB_REF_NAME" \
            --notes-file "docs/RELEASE_NOTES_${GITHUB_REF_NAME}.md"
