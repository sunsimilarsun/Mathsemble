name: Apply and validate question grouping
on:
  pull_request:
    paths:
      - '.maintenance/grouping.*'
      - '.github/workflows/apply-question-grouping.yml'
permissions:
  contents: write
jobs:
  apply-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/question-answer-grouping-20261026'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply verified source and tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, lzma, subprocess
          root=Path('.')
          assert subprocess.check_output(['git','hash-object','src/plugin.js'],text=True).strip() == 'e035f59a8df8c04c13851c0639eed56eadae5c7d', 'Unexpected source baseline'
          encoded=''.join(root.joinpath('.maintenance/grouping.part'+str(i)).read_text().strip() for i in (1,2))
          packed=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(packed).hexdigest() == '33f6a153763ee8b4f7a01f19ba0ed61c3d2f7b9417ade02bd6e2230d820bd0af', 'Bundle checksum mismatch'
          bundle=json.loads(lzma.decompress(packed))
          patch=Path('.maintenance/grouping.patch');patch.write_text(bundle['patch'])
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply',str(patch)],check=True)
          assert subprocess.check_output(['git','hash-object','src/plugin.js'],text=True).strip() == '893f4c67188c5bf975a1a5205fd5e7ac6c0b050f', 'Patched source differs from browser-tested source'
          allowed={'tests/question-answer-groups.test.cjs','tests/fixtures/group-mathjax.svg.html','docs/GROUP_PAGINATION.md'}
          assert set(bundle['files']) == allowed
          for name,content in bundle['files'].items():
              p=Path(name);assert not p.exists(), 'Refuse to overwrite existing additions'
              p.parent.mkdir(parents=True,exist_ok=True);p.write_text(content)
          for name in ('manifest.json','package.json','package-lock.json'):
              p=Path(name);data=json.loads(p.read_text());assert data['version']=='0.1.11'
              data['version']='0.1.12'
              if name=='package-lock.json': data['packages']['']['version']='0.1.12'
              p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          p=Path('README.md');text=p.read_text()
          text=text.replace('**Source version:** `0.1.11`','**Source version:** `0.1.12`')
          text+='\n## 2026-10-26 · 0.1.12 开发候选：题干与答案成组分页\n\n短题（含 answer）优先整组同页；长答案绑定题干与首个完整步骤后按段落或列表项续页；学生版绑定首段真实留白且不减少总高度。单文件讲义识别明确题标与相邻答案，文件夹组卷沿用既有题目容器。预览与 PDF 共用规则。详见 [分组规则、边界及验证](docs/GROUP_PAGINATION.md)。0.1.12 尚未发布正式 Release；公开 0.1.10 安装包不变。\n'
          p.write_text(text)
          p=Path('docs/REQUIREMENTS.md');p.write_text('> 0.1.12 开发补充：题干—答案成组分页按 [GROUP_PAGINATION.md](GROUP_PAGINATION.md) 执行；不能用减少学生留白或裁切内容换取同页。以下旧版验收记录保留。\n\n'+p.read_text())
          for name in ('.maintenance/grouping.part1','.maintenance/grouping.part2','.maintenance/grouping.patch','.github/workflows/apply-question-grouping.yml'):
              Path(name).unlink()
          PY
      - name: Full regression including real Chrome geometry
        run: |
          npm ci
          npm run prepublish-check
      - name: Commit tested source, generated bundle and documentation
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/plugin.js main.js manifest.json package.json package-lock.json README.md docs/GROUP_PAGINATION.md docs/REQUIREMENTS.md tests/question-answer-groups.test.cjs tests/fixtures/group-mathjax.svg.html .maintenance .github/workflows/apply-question-grouping.yml
          git diff --cached --stat
          git commit -m 'feat: keep question and answer together with measured semantic pagination'
          git push origin "HEAD:$BRANCH"
          git rev-parse HEAD
      - name: Prepare installation and review archives
        run: |
          mkdir -p dist/install
          cp main.js styles.css manifest.json dist/install/
          git archive --format=zip -o dist/Mathsemble-grouping-reviewed-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: Mathsemble-v0.1.12-grouped-install-only
          path: dist/install/
          if-no-files-found: error
          compression-level: 9
      - uses: actions/upload-artifact@v4
        with:
          name: Mathsemble-grouping-reviewed-source
          path: dist/Mathsemble-grouping-reviewed-source.zip
          if-no-files-found: error
