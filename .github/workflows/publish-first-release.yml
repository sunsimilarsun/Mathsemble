name: Publish initial Mathsemble 0.1.9 release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-first-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathsemble-first-release-0.1.9
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'sunsimilarsun/Mathsemble'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run MIT release preflight and regression tests
        run: npm run prepublish-check
      - name: Verify exact tested release files
        run: sha256sum -c release/SHA256SUMS.txt
      - name: Create 0.1.9 tag and Release with standalone assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view 0.1.9 >/dev/null 2>&1; then
            gh release upload 0.1.9 main.js manifest.json styles.css --clobber
          else
            gh release create 0.1.9 main.js manifest.json styles.css \
              --target 2bd0fe7857e9ac054eebe699875b80b852b0617b \
              --title "Mathsemble 0.1.9" \
              --notes-file docs/RELEASE_NOTES_0.1.9.md
          fi
      - name: Verify three standalone Obsidian release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          actual="$(gh release view 0.1.9 --json assets --jq '.assets | map(.name) | sort | join(",")')"
          echo "Release files: $actual"
          test "$actual" = "main.js,manifest.json,styles.css"
