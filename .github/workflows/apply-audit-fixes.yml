name: Apply and validate audited fixes

on:
  pull_request:
    paths:
      - .maintenance/audit-fixes.part1
      - .maintenance/audit-fixes.part2
      - .github/workflows/apply-audit-fixes.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/audit-seven-issues-20261026'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply checksum-verified audit source and regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, lzma, subprocess
          root=Path('.')
          before=subprocess.check_output(['git','hash-object','src/plugin.js'],text=True).strip()
          assert before == '893f4c67188c5bf975a1a5205fd5e7ac6c0b050f', 'Unexpected source baseline'
          encoded=''.join(root.joinpath('.maintenance/audit-fixes.part'+str(i)).read_text().strip() for i in (1,2))
          packed=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(packed).hexdigest() == 'a1225e13f362c569a913a44e9c09ce607f71432363b5b8bf98f5765352361740', 'Patch checksum mismatch'
          bundle=json.loads(lzma.decompress(packed))
          patch=Path('.maintenance/audit-fixes.patch');patch.write_text(bundle['patch'])
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply',str(patch)],check=True)
          assert subprocess.check_output(['git','hash-object','src/plugin.js'],text=True).strip() == '8fa1739e5b8f9b3cfd85944142876a4ec951f903', 'Patched source differs from browser-tested code'
          allowed={'docs/AUDIT_FIX_0.1.13.md','tests/audit-regressions.test.cjs','tests/helpers/run-chromium.cjs'}
          assert set(bundle['files']) == allowed
          for name,content in bundle['files'].items():
              p=Path(name);assert not p.exists(), 'Refuse to overwrite additions'
              p.parent.mkdir(parents=True,exist_ok=True);p.write_text(content)
          for name in ('.maintenance/audit-fixes.part1','.maintenance/audit-fixes.part2','.maintenance/audit-fixes.patch','.github/workflows/apply-audit-fixes.yml'):
              Path(name).unlink()
          PY
      - name: Full regression including real Chromium
        run: |
          npm ci
          npm run prepublish-check
      - name: Commit only verified repairs and documentation
        env:
          BRANCH: fix/audit-seven-issues-20261026
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/plugin.js main.js manifest.json package.json package-lock.json README.md docs/AUDIT_FIX_0.1.13.md tests/audit-regressions.test.cjs tests/helpers/run-chromium.cjs tests/question-answer-groups.test.cjs tests/regression.test.cjs .maintenance .github/workflows/apply-audit-fixes.yml
          git diff --cached --stat
          git commit -m 'fix: close seven audited projection, measurement, pagination and preview defects'
          git push origin "HEAD:$BRANCH"
          git rev-parse HEAD
      - name: Prepare pure installation and review archives
        run: |
          mkdir -p dist/install
          cp main.js styles.css manifest.json dist/install/
          git archive --format=zip -o dist/Mathsemble-audit-fixed-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: Mathsemble-v0.1.13-audit-fixes-install-only
          path: dist/install/
          if-no-files-found: error
          compression-level: 9
      - uses: actions/upload-artifact@v4
        with:
          name: Mathsemble-audit-fixed-source
          path: dist/Mathsemble-audit-fixed-source.zip
          if-no-files-found: error
