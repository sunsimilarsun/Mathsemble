name: Final audit math context validation

on:
  pull_request:
    paths:
      - .github/workflows/finalize-audit-math.yml

permissions:
  contents: write

jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/audit-seven-issues-20261026'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact display math guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma, subprocess
          assert subprocess.check_output(['git','hash-object','src/plugin.js'],text=True).strip() == '8fa1739e5b8f9b3cfd85944142876a4ec951f903'
          encoded=''
          packed=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(packed).hexdigest() == 'bdc6d9ffb7dfc9ce87e33aac6510f937eec87ae8ff7ee1a9b8f0aac3e5a5be34'
          patch=Path('audit-math.patch');patch.write_bytes(lzma.decompress(packed))
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply',str(patch)],check=True)
          assert subprocess.check_output(['git','hash-object','src/plugin.js'],text=True).strip() == '5cc75693f28af050ddd1bd15303f032629e813d1'
          patch.unlink()
          Path('.github/workflows/finalize-audit-math.yml').unlink()
          PY
      - name: Validate all fixes
        run: |
          npm ci
          npm run prepublish-check
      - name: Commit verified final source
        env:
          BRANCH: fix/audit-seven-issues-20261026
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/plugin.js main.js tests/audit-regressions.test.cjs docs/AUDIT_FIX_0.1.13.md .github/workflows/finalize-audit-math.yml
          git commit -m 'fix: preserve indented display-math answer slots while protecting code'
          git push origin "HEAD:$BRANCH"
          git rev-parse HEAD
      - name: Prepare final archives
        run: |
          mkdir -p dist/install
          cp main.js styles.css manifest.json dist/install/
          git archive --format=zip -o dist/Mathsemble-audit-final-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: Mathsemble-v0.1.13-audit-fixes-install-only
          path: dist/install/
          compression-level: 9
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Mathsemble-audit-final-source
          path: dist/Mathsemble-audit-final-source.zip
          if-no-files-found: error
