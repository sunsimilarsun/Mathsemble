name: Integrate reliability candidate
on:
  push:
    branches: [fix/reliability-baseline-20261103]
    paths: ['.integration/**']
permissions:
  contents: read
concurrency:
  group: mathsemble-reliability-integration
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply verified candidate without modifying main
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = 'fix/reliability-baseline-20261103'
          git merge-base --is-ancestor 5f2d8819352d8701151e2b947b0d2e5aad6c32cc HEAD
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma, subprocess, re
          parts = [Path(f'.integration/payload.{i:02}').read_text().strip() for i in range(4)]
          compressed = base64.b64decode(''.join(parts), validate=True)
          assert hashlib.sha256(compressed).hexdigest() == '842e19dd9ca290e3ce664f97d4a210f3d550ab3851cb95ec88265addfa1db7a2'
          patch = lzma.decompress(compressed)
          assert hashlib.sha256(patch).hexdigest() == '5cfcf4b3b0ccce511cd3a7088114bdb9279122572d21732b199f78fe2cdfd693'
          patch = re.sub(rb'(new file mode 100644\n)--- a/[^\n]+', rb'\1--- /dev/null', patch)
          original = Path('tests/templates.test.cjs').read_text()
          integration = original.replace("const root = path.resolve(__dirname, '..');", "const root = path.resolve(__dirname, '../..');")
          old = "const templateDir = process.env.MATHSEMBLE_TEMPLATE_DIR\n  ? path.resolve(process.env.MATHSEMBLE_TEMPLATE_DIR)\n  : path.join(root, 'templates');"
          new = "if (!process.env.MATHSEMBLE_TEMPLATE_DIR) {\n  throw new Error('External template acceptance requires MATHSEMBLE_TEMPLATE_DIR; use npm run test:templates. Core fixtures are tested by npm test.');\n}\nconst templateDir = path.resolve(process.env.MATHSEMBLE_TEMPLATE_DIR);"
          assert integration.count(old) == 1
          integration = integration.replace(old, new)
          subprocess.run(['git','apply','--unidiff-zero','--check','-'], input=patch, check=True)
          subprocess.run(['git','apply','--unidiff-zero','-'], input=patch, check=True)
          Path('tests/integration').mkdir(exist_ok=True)
          Path('tests/integration/templates.test.cjs').write_text(integration)
          PY
          npm run build
          node --check src/plugin.js
          node --check main.js
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          source = Path('src/plugin.js').read_bytes()
          assert hashlib.sha256(source).hexdigest() == 'cf1d4d5ff5dde3de5ba148dc8c7d403289f6d24b56803267965d395c9851c2ef'
          assert Path('main.js').read_bytes() == source
          PY
      - name: Commit candidate and remove one-time transport
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git rm -r .integration .github/workflows/integrate-reliability-candidate.yml
          git add README.md docs/NAMING.md src/plugin.js main.js package.json scripts/test-templates.mjs tests
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: integrate verified Mathsemble reliability fixes and naming'
          git push origin HEAD:refs/heads/fix/reliability-baseline-20261103
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: integrate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Locate Chrome on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candidates = @((Join-Path $env:ProgramFiles 'Google\Chrome\Application\chrome.exe'), (Join-Path ${env:ProgramFiles(x86)} 'Google\Chrome\Application\chrome.exe'))
          $chrome = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $chrome) { throw 'Chrome is required' }
          "CHROME_PATH=$chrome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Full tests and publication prerequisites (no release)
        run: |
          set -euo pipefail
          npm run prepublish-check 2>&1 | tee full-check.log
          git diff --exit-code -- src/plugin.js main.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reliability-${{ matrix.os }}
          path: |
            full-check.log
            main.js
            styles.css
            manifest.json
          retention-days: 14
