name: Apply and verify strict H5 pagination
on:
  pull_request:
    paths:
      - '.maintenance/h5.part*'
      - '.github/workflows/apply-strict-h5.yml'
permissions:
  contents: write
jobs:
  apply-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/strict-h5-question-pagination-20261026'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply source verified by checksum and Git blob identities
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, lzma, subprocess
          def blob(name):
              return subprocess.check_output(['git','hash-object',name],text=True).strip()
          assert blob('src/plugin.js') == '30aa42b0155d4dda2ff585888ea32d716778ec17', 'Unexpected source baseline'
          encoded=''.join(Path('.maintenance/h5.part'+str(i)).read_text().strip() for i in range(1,5))
          packed=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(packed).hexdigest() == 'd62ec0c487935a625f67a777241ca36d60aaf2ba19098dad40b58ceb623eb4dc', 'Transport checksum mismatch'
          bundle=json.loads(lzma.decompress(packed))
          patch=Path('.maintenance/h5.patch');patch.write_text(bundle['patch'])
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply',str(patch)],check=True)
          assert blob('src/plugin.js') == '025b74d64677ff54b082833ac0e66f3d1bab68b4', 'Source differs from tested source'
          assert blob('styles.css') == 'c980444417e2903b4709f49a903f01e7cdea0d68', 'Styles differ from tested styles'
          allowed={'tests/strict-h5.test.cjs','tests/fixtures/strict-h5-commonmark.json','docs/MARKDOWN_SPEC.md','docs/STRICT_H5_PAGINATION.md','templates/讲义_五级题目标题.md'}
          assert set(bundle['files']) == allowed
          for name, content in bundle['files'].items():
              p=Path(name);assert not p.exists(), 'Refuse to overwrite additions'
              p.parent.mkdir(parents=True,exist_ok=True);p.write_text(content)
          p=Path('package.json');pkg=json.loads(p.read_text())
          assert pkg['scripts']['test']=='node --test tests/*.test.cjs'
          pkg['scripts']['test']='node --test --test-concurrency=1 tests/*.test.cjs'
          p.write_text(json.dumps(pkg,ensure_ascii=False,indent=2)+'\n')
          p=Path('README.md');text=p.read_text()
          old='**Source version:** `0.1.14`';assert text.count(old)==1
          text=text.replace(old,'**Source version:** `0.1.15`')
          title='## Installation'
          note='## 0.1.15 development: strict question boundaries\n\nUse a top-level `##### 例1`, `##### 变式1`, `##### 练习1`, `##### 检测1`, or `##### 第1题` for each handout question. The next H1–H5 ends it; H6 headings and interleaved subquestions/answers remain inside. Short questions stay on one page; long questions start a fresh page, without shortening student writing space. Existing H3 labels are not automatically rewritten or treated as complete questions. See [Markdown 规范](docs/MARKDOWN_SPEC.md), [五级题目模板](templates/讲义_五级题目标题.md), and [implementation and acceptance](docs/STRICT_H5_PAGINATION.md). This is a development build, not a new Release.\n\n'
          assert text.count(title)==1;text=text.replace(title,note+title)
          p.write_text(text)
          p=Path('docs/REQUIREMENTS.md');p.write_text('> 0.1.15 当前题目边界与分页规则以 [Markdown 规范](MARKDOWN_SPEC.md) 和 [严格五级标题分页](STRICT_H5_PAGINATION.md) 为准：五级题目标注、六级题内标题、短题不拆、长题新页起排。下文旧版推断规则仅保留历史记录，不再作为新讲义识别标准。\n\n'+p.read_text())
          for i in range(1,5): Path('.maintenance/h5.part'+str(i)).unlink()
          patch.unlink();Path('.github/workflows/apply-strict-h5.yml').unlink()
          PY
      - name: Full regression including real Chromium
        run: |
          npm ci
          npm run prepublish-check
      - name: Commit tested runtime, specification and template
        env:
          BRANCH: fix/strict-h5-question-pagination-20261026
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/plugin.js main.js styles.css manifest.json package.json package-lock.json README.md docs/GROUP_PAGINATION.md docs/REQUIREMENTS.md docs/MARKDOWN_SPEC.md docs/STRICT_H5_PAGINATION.md templates/讲义_五级题目标题.md tests/strict-h5.test.cjs tests/fixtures/strict-h5-commonmark.json tests/regression.test.cjs .maintenance .github/workflows/apply-strict-h5.yml
          git diff --cached --stat
          git commit -m 'feat: define source-mapped H5 questions and enforce strict pagination'
          git push origin "HEAD:$BRANCH"
          git rev-parse HEAD
      - name: Prepare pure installation and reviewed source
        run: |
          mkdir -p dist/install
          cp main.js styles.css manifest.json dist/install/
          git archive --format=zip -o dist/Mathsemble-strict-h5-reviewed-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: Mathsemble-v0.1.15-strict-h5-install-only
          path: dist/install/
          if-no-files-found: error
          compression-level: 9
      - uses: actions/upload-artifact@v4
        with:
          name: Mathsemble-strict-h5-reviewed-source
          path: dist/Mathsemble-strict-h5-reviewed-source.zip
          if-no-files-found: error
