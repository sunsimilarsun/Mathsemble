name: Publish Mathsemble 0.1.10 maintenance release
on:
  push:
    branches: [main]
    paths:
      - 'manifest.json'
      - 'tests/regression.test.cjs'
      - '.github/workflows/publish-maintenance-0.1.10.yml'
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    if: github.repository == 'sunsimilarsun/Mathsemble'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Require exact maintenance release version
        run: test "$(node -p 'require("./manifest.json").version')" = '0.1.10'
      - run: npm ci
      - run: npm run prepublish-check
      - name: Require tracked source and exact build parity
        run: |
          test -s src/main.js
          git diff --exit-code -- main.js
      - name: Attest JavaScript release asset
        uses: actions/attest@v4
        with:
          subject-path: main.js
      - name: Attest CSS release asset
        uses: actions/attest@v4
        with:
          subject-path: styles.css
      - name: Create immutable release target and assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view 0.1.10 >/dev/null 2>&1; then
            echo '0.1.10 already exists; refusing to overwrite the release.'
            exit 1
          fi
          gh release create 0.1.10 main.js manifest.json styles.css \
            --target "$GITHUB_SHA" \
            --title 'Mathsemble 0.1.10' \
            --notes-file docs/RELEASE_NOTES_0.1.10.md \
            --latest
