name: Build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  id-token: write
  attestations: write
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Locate Chrome on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $chromeCandidates = @(
            (Join-Path $env:ProgramFiles 'Google\Chrome\Application\chrome.exe'),
            (Join-Path ${env:ProgramFiles(x86)} 'Google\Chrome\Application\chrome.exe')
          )
          $chromeExecutable = $chromeCandidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $chromeExecutable) { throw 'Chrome is required for Windows layout regression tests' }
          "CHROME_PATH=$chromeExecutable" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Emulate Community scanner clean build (remove all main.js outputs)
        run: |
          find . -type f -name main.js -delete
          test ! -e main.js
          test -s src/plugin.js
      - run: npm run check
      - name: Ensure release code was committed from source
        run: git diff --exit-code -- src/plugin.js main.js
      - name: Attest JavaScript build provenance (main branch)
        if: github.event_name == 'push' && runner.os == 'Linux'
        uses: actions/attest@v4
        with:
          subject-path: main.js
      - name: Attest CSS build provenance (main branch)
        if: github.event_name == 'push' && runner.os == 'Linux'
        uses: actions/attest@v4
        with:
          subject-path: styles.css
