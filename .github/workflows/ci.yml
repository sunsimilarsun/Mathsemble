name: Build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  id-token: write
  attestations: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Require tracked source (not a partial scanner extract)
        run: test -s src/main.js
      - run: npm run check
      - name: Ensure release code was committed from source
        run: git diff --exit-code -- main.js
      - name: Attest JavaScript build provenance (main branch)
        if: github.event_name == 'push'
        uses: actions/attest@v4
        with:
          subject-path: main.js
      - name: Attest CSS build provenance (main branch)
        if: github.event_name == 'push'
        uses: actions/attest@v4
        with:
          subject-path: styles.css
